suite: External Secret rendering
templates:
  - templates/externalsecret.yaml
values:
  - values.yaml

tests:
  - it: should not render when disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ExternalSecret when enabled
    set:
      secrets:
        externalSecrets:
          enabled: true
          refreshInterval: 1h
          data:
            - secretKey: password
              remoteRef:
                key: spaceup/db
                property: password
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
      - equal:
          path: spec.refreshInterval
          value: 1h
      - isSubset:
          path: spec.data[0]
          content:
            secretKey: password
            remoteRef:
              key: spaceup/db
              property: password
