apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-consul-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: spaceup-platform-runtime
  # The Consul dependency creates these named RBAC helpers only while it
  # initializes TLS and gossip encryption. They are neither runtime workloads
  # nor data and must not make the release appear degraded after success.
  orphanedResources:
    ignore:
      - group: ""
        kind: ServiceAccount
        name: consul-gossip-encryption-autogenerate
      - group: ""
        kind: ServiceAccount
        name: consul-tls-init
      - group: rbac.authorization.k8s.io
        kind: Role
        name: consul-gossip-encryption-autogenerate
      - group: rbac.authorization.k8s.io
        kind: Role
        name: consul-tls-init
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
        name: consul-gossip-encryption-autogenerate
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
        name: consul-tls-init
  ignoreDifferences:
    # Kubernetes defaults these fields although the Consul chart intentionally
    # omits them. They do not alter the desired server or its PVC contents.
    - group: apps
      kind: StatefulSet
      name: consul-server
      namespace: platform-runtime
      jqPathExpressions:
        - .spec.persistentVolumeClaimRetentionPolicy
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.template.spec.containers[]?.env[]?.valueFrom.fieldRef.apiVersion
        - .spec.template.spec.initContainers[]?.env[]?.valueFrom.fieldRef.apiVersion
        - .spec.template.spec.containers[]?.volumeMounts[]? | select(.mountPath == "/tmp").readOnly
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/helm/platform/runtime/consul
    helm:
      valueFiles: [values.yaml, values-local.yaml]
      version: v3
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-runtime
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
