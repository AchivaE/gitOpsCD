apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spaceup-platform-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    # Explicit catalogue: adding a directory under helm/services never deploys
    # a new workload by accident. A service is admitted through a reviewed
    # catalogue change including its dependency wave.
    - list:
        elements:
          - name: config-ingestor
            chartPath: argoCD/helm/services/config-ingestor
            syncWave: "-10"
          - name: gateway-ingestor
            chartPath: argoCD/helm/services/gateway-ingestor
            syncWave: "0"
  template:
    metadata:
      name: "dev-{{name}}"
      annotations:
        # Foundation (-20) -> runtime/Consul (-15) -> Config (-10) -> Edge (0).
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
      labels:
        environment: dev
        app.kubernetes.io/name: "{{name}}"
    spec:
      project: spaceup-platform-dev
      source:
        repoURL: https://github.com/AchivaE/gitOpsCD.git
        path: "{{chartPath}}"
        targetRevision: main
        helm:
          valueFiles: [values.yaml, values-dev.yaml, values-local.yaml]
          version: v3
      destination:
        server: https://kubernetes.default.svc
        namespace: spaceup-dev
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - PrunePropagationPolicy=foreground
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - SkipSchemaValidation=false
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [/spec/replicas]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers: [/spec/conversion/webhook/clientConfig/caBundle]
