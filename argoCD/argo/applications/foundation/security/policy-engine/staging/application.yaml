apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-policy-engine-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-17"
spec:
  project: spaceup-cluster-addons
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/helm/foundation/security/policy-engine
    helm:
      releaseName: policy-engine
      valueFiles: [values.yaml, values-azure.yaml, values-staging.yaml]
      version: v3
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # Manual promotion until targetRevision is a reviewed immutable Git SHA or tag.
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true, FailOnSharedResource=true]
