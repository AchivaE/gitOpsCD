# This module deliberately refuses any environment other than local. Staging
# and production use the externally operated event-plane defined in the runbook.
platform:
  environment: unset

kafka:
  fullnameOverride: kafka

  # A single controller+broker is a developer test target, never an HA design.
  controller:
    replicaCount: 1
    controllerOnly: false
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    persistence:
      enabled: true
      size: 8Gi
  broker:
    replicaCount: 0

  # Local traffic is deliberately plaintext. It is not a security reference
  # implementation for staging or production; those connect to external Kafka
  # with private networking, TLS and workload identity.
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  tls:
    autoGenerated:
      enabled: false

  serviceAccount:
    automountServiceAccountToken: false
  networkPolicy:
    enabled: true
    allowExternal: false
    addExternalClientAccess: true
    allowExternalEgress: true
  provisioning:
    enabled: false
