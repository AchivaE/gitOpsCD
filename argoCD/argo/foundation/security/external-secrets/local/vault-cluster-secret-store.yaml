# Local-only store. The bootstrap script configures its Vault Kubernetes Auth
# role; no Vault token or secret value is stored in Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-local
  annotations:
    argocd.argoproj.io/sync-wave: "-16"
spec:
  provider:
    vault:
      server: http://vault.platform-security.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences: [vault]
