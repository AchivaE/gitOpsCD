apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-gateway-ingestor
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: spaceup-platform-prod
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/helm/services/networking/api-gateway
    helm: { valueFiles: [values.yaml, values-azure.yaml, values-prod.yaml], version: v3 }
  destination: { server: https://kubernetes.default.svc, namespace: spaceup }
  syncPolicy:
    syncOptions: [PrunePropagationPolicy=foreground, RespectIgnoreDifferences=true, ServerSideApply=true, SkipSchemaValidation=false]
