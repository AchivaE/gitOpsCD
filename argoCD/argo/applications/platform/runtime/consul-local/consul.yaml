apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-consul-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: spaceup-platform-runtime
  ignoreDifferences:
    # Kubernetes defaults these fields although the Consul chart intentionally
    # omits them. They do not alter the desired server or its PVC contents.
    - group: apps
      kind: StatefulSet
      name: consul-server
      namespace: platform-runtime
      jqPathExpressions:
        # Kubernetes v1.32 injects the following StatefulSet defaults while
        # the upstream Consul 1.5.1 chart deliberately omits them. Each path
        # is a Kubernetes-owned default only; Consul's configuration, image,
        # probes, resources, labels, secrets and PVC capacity remain tracked.
        - .spec.persistentVolumeClaimRetentionPolicy
        - .spec.revisionHistoryLimit
        - .spec.updateStrategy
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.volumeClaimTemplates[]?.status
        - .spec.template.spec.dnsPolicy
        - .spec.template.spec.restartPolicy
        - .spec.template.spec.schedulerName
        - .spec.template.spec.serviceAccount
        - .spec.template.spec.volumes[]?.configMap.defaultMode
        - .spec.template.spec.volumes[]?.secret.defaultMode
        - .spec.template.spec.containers[]?.env[]?.valueFrom.fieldRef.apiVersion
        - .spec.template.spec.containers[]?.ports[]? | select(.name == "https" or .name == "server").protocol
        - .spec.template.spec.containers[]?.terminationMessagePath
        - .spec.template.spec.containers[]?.terminationMessagePolicy
        - .spec.template.spec.initContainers[]?.env[]?.valueFrom.fieldRef.apiVersion
        - .spec.template.spec.initContainers[]?.resources
        - .spec.template.spec.initContainers[]?.terminationMessagePath
        - .spec.template.spec.initContainers[]?.terminationMessagePolicy
        - .spec.template.spec.containers[]?.volumeMounts[]? | select(.mountPath == "/tmp").readOnly
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/helm/platform/runtime/consul
    helm:
      valueFiles: [values.yaml, values-local.yaml]
      version: v3
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-runtime
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
