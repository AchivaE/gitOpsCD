# Portable local-cluster profile. Images are pulled directly from GitHub
# Container Registry; credentials are provided out-of-band by ghcr-achivae.
image:
  repository: ghcr.io/achivae/config-ingestor
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-achivae
replicas: 1
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
monitoring:
  enabled: false
externalSecret:
  enabled: false
configRepository:
  enabled: false
consul:
  enabled: false
networkPolicy:
  enabled: false
