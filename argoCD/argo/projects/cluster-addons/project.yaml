apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: spaceup-cluster-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Single controlled deployment of cluster-scoped platform add-ons.
  sourceRepos:
    - https://github.com/spaceUp-Inovation/spaceup-platform.git
    - https://charts.external-secrets.io
  destinations:
    - namespace: platform-system
      server: https://kubernetes.default.svc
    # External Secrets Operator is a cluster add-on, but runs in its dedicated
    # namespace rather than alongside Prometheus and cert-manager.
    - namespace: external-secrets
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist: []
