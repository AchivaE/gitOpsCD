# Secure base. This module has no local profile: identity testing must use an
# isolated test realm and database, never a production-shaped deployment on a
# developer workstation.
platform:
  environment: unset

externalSecrets:
  enabled: false
  secretStoreRef: azure-keyvault
  refreshInterval: 1h
  adminPasswordRemoteKey: REPLACE_WITH_KEYCLOAK_ADMIN_PASSWORD_SECRET
  dbHostRemoteKey: REPLACE_WITH_KEYCLOAK_DB_HOST_SECRET
  dbPortRemoteKey: REPLACE_WITH_KEYCLOAK_DB_PORT_SECRET
  dbUserRemoteKey: REPLACE_WITH_KEYCLOAK_DB_USER_SECRET
  dbNameRemoteKey: REPLACE_WITH_KEYCLOAK_DB_NAME_SECRET
  dbPasswordRemoteKey: REPLACE_WITH_KEYCLOAK_DB_PASSWORD_SECRET
  tlsCertRemoteKey: REPLACE_WITH_KEYCLOAK_TLS_CERT_SECRET
  tlsKeyRemoteKey: REPLACE_WITH_KEYCLOAK_TLS_KEY_SECRET
  dbCaRemoteKey: REPLACE_WITH_KEYCLOAK_DB_CA_SECRET

keycloak:
  production: true
  auth:
    adminUser: platform-admin
    existingSecret: keycloak-admin
    passwordSecretKey: admin-password
  replicaCount: 3
  podAntiAffinityPreset: hard
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: keycloak
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  pdb:
    create: true
    minAvailable: 2
  service:
    type: ClusterIP
    http:
      enabled: false
  tls:
    enabled: true
    usePem: true
    existingSecret: keycloak-internal-tls
  proxyHeaders: xforwarded
  extraEnvVars:
    - name: KC_DB_URL_PROPERTIES
      value: sslmode=verify-full
    # With proxyHeaders enabled, chart version 24.4.6 does not infer the
    # external Keycloak hostname. This is the canonical OIDC issuer origin.
    - name: KC_HOSTNAME
      value: "https://{{ .Values.ingress.hostname }}"
  customCaExistingSecret: keycloak-db-ca
  postgresql:
    enabled: false
  externalDatabase:
    existingSecret: keycloak-db
    existingSecretHostKey: host
    existingSecretPortKey: port
    existingSecretUserKey: username
    existingSecretDatabaseKey: database
    existingSecretPasswordKey: password
  ingress:
    enabled: true
    hostname: REPLACE_WITH_KEYCLOAK_PUBLIC_HOSTNAME
    hostnameStrict: true
    servicePort: https
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  adminIngress:
    enabled: false
  networkPolicy:
    enabled: true
    allowExternal: false
    allowExternalEgress: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      labels: {}
