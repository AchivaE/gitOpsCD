{{- if hasPrefix "REPLACE_WITH_" .Values.image.tag }}
{{- fail "image.tag must be an immutable image tag or digest promoted by CI" }}
{{- end }}
{{- if and .Values.image.requireDigest (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.tag)) }}
{{- fail "production image.tag must be a sha256 digest promoted by CI" }}
{{- end }}
{{- if and .Values.ingress.enabled (hasPrefix "REPLACE_WITH_" .Values.ingress.host) }}
{{- fail "ingress.host must be a real hostname when ingress.enabled=true" }}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.ingress.controllerVerified) }}
{{- fail "ingress.controllerVerified must be true only after the selected Foundation IngressClass is installed and tested" }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not .Values.oidc.enabled }}
{{- fail "a public gateway requires OIDC resource-server configuration" }}
{{- end }}
{{- if not .Values.oidc.applicationSecurityVerified }}
{{- fail "OIDC cannot be enabled until the gateway binary includes and verifies OAuth2 Resource Server security" }}
{{- end }}
{{- $issuer := required "oidc.issuerUri is required for a public gateway" .Values.oidc.issuerUri }}
{{- $jwks := required "oidc.jwkSetUri is required for a public gateway" .Values.oidc.jwkSetUri }}
{{- if or (hasPrefix "REPLACE_WITH_" $issuer) (not (hasPrefix "https://" $issuer)) (hasPrefix "REPLACE_WITH_" $jwks) (not (hasPrefix "https://" $jwks)) }}
{{- fail "OIDC issuer and JWKS endpoints must be real HTTPS URIs" }}
{{- end }}
{{- if eq (len .Values.oidc.audiences) 0 }}
{{- fail "at least one OIDC audience is required for a public gateway" }}
{{- end }}
{{- range .Values.oidc.audiences }}
{{- if hasPrefix "REPLACE_WITH_" . }}
{{- fail "OIDC audiences must be real client or resource identifiers" }}
{{- end }}
{{- end }}
{{- if eq (len .Values.oidc.egressCidrs) 0 }}
{{- fail "network policy requires private OIDC endpoint CIDR(s)" }}
{{- end }}
{{- range .Values.oidc.egressCidrs }}
{{- if hasPrefix "REPLACE_WITH_" . }}
{{- fail "OIDC egress must contain only real private endpoint CIDR(s)" }}
{{- end }}
{{- end }}
{{- if not .Values.cors.enabled }}
{{- fail "a public gateway requires an explicit CORS allow-list contract" }}
{{- end }}
{{- if not .Values.cors.applicationSecurityVerified }}
{{- fail "CORS cannot be enabled until the gateway binary consumes and verifies the allow-list" }}
{{- end }}
{{- if eq (len .Values.cors.allowedOrigins) 0 }}
{{- fail "CORS requires at least one trusted HTTPS origin" }}
{{- end }}
{{- range .Values.cors.allowedOrigins }}
{{- if or (eq . "*") (hasPrefix "REPLACE_WITH_" .) (not (hasPrefix "https://" .)) }}
{{- fail "CORS origins must be explicit HTTPS origins; wildcards are forbidden" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.consul.enabled }}
{{- $consulHost := required "consul.host must name the private Consul HTTPS endpoint when consul.enabled=true" .Values.consul.host }}
{{- if hasPrefix "REPLACE_WITH_" $consulHost }}
{{- fail "consul.host must be replaced with the private Consul DNS name before Argo CD can deploy gateway-ingestor" }}
{{- end }}
{{- if ne .Values.consul.scheme "https" }}
{{- fail "Consul must use HTTPS in this production chart" }}
{{- end }}
{{- end }}
{{- if .Values.vault.enabled }}
{{- $vaultUri := required "vault.uri must name the private Vault HTTPS endpoint when vault.enabled=true" .Values.vault.uri }}
{{- if or (hasPrefix "REPLACE_WITH_" $vaultUri) (not (hasPrefix "https://" $vaultUri)) }}
{{- fail "vault.uri must be a private HTTPS endpoint when vault.enabled=true" }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.consul.enabled }}
{{- range .Values.networkPolicy.consulEgressCidrs }}
{{- if hasPrefix "REPLACE_WITH_" . }}
{{- fail "networkPolicy.consulEgressCidrs must contain only the private Consul API CIDR(s)" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.vault.enabled }}
{{- range .Values.networkPolicy.vaultEgressCidrs }}
{{- if hasPrefix "REPLACE_WITH_" . }}
{{- fail "networkPolicy.vaultEgressCidrs must contain only the private Vault API CIDR(s)" }}
{{- end }}
{{- end }}
{{- if and .Values.monitoring.requiredForPromotion (not .Values.monitoring.serviceMonitorEnabled) }}
{{- fail "staging and production require monitoring.serviceMonitorEnabled=true after Prometheus endpoint verification" }}
{{- end }}
{{- if and .Values.monitoring.serviceMonitorEnabled (not .Values.monitoring.applicationMetricsVerified) }}
{{- fail "Set monitoring.applicationMetricsVerified=true only after the application exposes verified Prometheus metrics" }}
{{- end }}
{{- end }}
