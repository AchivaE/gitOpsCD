apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: spaceup-platform-identity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Identity-plane modules isolated from workloads and platform runtime.
  sourceRepos:
    - https://github.com/AchivaE/gitOpsCD.git
  destinations:
    - namespace: platform-identity
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "", kind: ConfigMap }
    - { group: "", kind: Secret }
    - { group: "", kind: Service }
    - { group: "", kind: ServiceAccount }
    - { group: apps, kind: StatefulSet }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: external-secrets.io, kind: ExternalSecret }
    - { group: monitoring.coreos.com, kind: PrometheusRule }
    - { group: monitoring.coreos.com, kind: ServiceMonitor }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: policy, kind: PodDisruptionBudget }
  orphanedResources:
    warn: true
