apiVersion: v2
name: cluster-addons
description: Cluster-scoped observability and certificate add-ons for SpaceUp
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: kube-prometheus-stack
    version: "68.4.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled
  - name: cert-manager
    version: "v1.15.3"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled
