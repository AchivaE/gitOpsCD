apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-keycloak-prod
  namespace: argocd
  annotations:
    # Activation is manual: see helm/platform/identity/keycloak/README.md.
    platform.spaceup.io/standard-profile: disabled-until-prerequisites-verified
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: spaceup-platform-identity
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/helm/platform/identity/keycloak
    helm:
      valueFiles: [values.yaml, values-azure.yaml, values-prod.yaml]
      version: v3
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-identity
  syncPolicy:
    syncOptions:
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
