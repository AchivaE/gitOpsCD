{{- if .Values.certificateIssuers.enabled }}
{{- range $environment, $issuer := .Values.certificateIssuers.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $issuer.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: cluster-addons
    app.kubernetes.io/component: certificate-issuer
    environment: {{ $environment }}
spec:
  acme:
    email: {{ required "certificateIssuers.acmeEmail is required" $.Values.certificateIssuers.acmeEmail | quote }}
    server: {{ $issuer.server | quote }}
    privateKeySecretRef:
      name: {{ $issuer.accountKeySecret }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ $.Values.certificateIssuers.ingressClassName | quote }}
{{- end }}
{{- end }}
