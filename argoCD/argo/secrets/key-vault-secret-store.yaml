# Terraform provisions the federated identity and Key Vault RBAC. CI substitutes
# the IDs below from Terraform outputs; this manifest contains no credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyvault-external-secrets
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: REPLACE_WITH_TERRAFORM_OUTPUT_CLIENT_ID
    azure.workload.identity/tenant-id: REPLACE_WITH_AZURE_TENANT_ID
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: REPLACE_WITH_KEY_VAULT_URI
      serviceAccountRef:
        name: keyvault-external-secrets
        namespace: external-secrets
