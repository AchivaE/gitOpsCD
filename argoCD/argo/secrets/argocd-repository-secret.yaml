# The initial copy is injected outside Git during bootstrap. ESO owns rotations.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-spaceup-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: github-spaceup-platform
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
          app.kubernetes.io/name: spaceup-platform
          app.kubernetes.io/managed-by: external-secrets
      data:
        type: git
        url: https://github.com/AchivaE/gitOpsCD.git
        username: x-access-token
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: argocd-repository-token
