# Portable local-cluster profile. Images are pulled directly from GitHub
# Container Registry; credentials are provided out-of-band by ghcr-achivae.
image:
  repository: ghcr.io/achivae/gateway-ingestor
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-achivae
replicas: 1
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
ingress:
  enabled: false
certificate:
  enabled: false
bootstrap:
  configServerUrl: http://config-ingestor:8888
  configFailFast: false
consul:
  enabled: false
vault:
  enabled: false
externalSecrets:
  enabled: false
networkPolicy:
  enabled: false
monitoring:
  enabled: false
