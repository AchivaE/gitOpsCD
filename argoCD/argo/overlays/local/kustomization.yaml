apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Docker Desktop, kind and k3d: no Azure identity, Key Vault or cluster add-ons.
resources:
  - ../../namespaces/local
  - ../../projects/dev
  - ../../projects/cluster-addons
  - ../../projects/identity
  - ../../projects/platform-runtime
  - ../../projects/security
  - ../../management/argocd/config
  - ../../applications/foundation/security/policy-engine/local
  - ../../applications/foundation/security/external-secrets
  - ../../applications/platform/security/vault-local
  - ../../applications/foundation/security/external-secrets/local-store
  - ../../applications/foundation/networking/cert-manager-local
  - ../../applications/platform/observability/monitoring-local
  - ../../applications/platform/runtime/consul-local
  - ../../applications/platform/identity/keycloak-local
  - ../../applications/services/configuration/config-server/local
  - ../../applications/services/networking/api-gateway/local
  - ../../management/argocd/rbac
