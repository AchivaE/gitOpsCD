# Activate only from an EKS overlay after Terraform created this IRSA role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-secrets-manager-external-secrets
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_OUTPUT_ROLE_ARN
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_WITH_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: aws-secrets-manager-external-secrets
            namespace: external-secrets
