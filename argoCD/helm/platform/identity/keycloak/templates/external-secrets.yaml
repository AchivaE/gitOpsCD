{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { name: {{ .Values.externalSecrets.secretStoreRef }}, kind: ClusterSecretStore }
  target: { name: keycloak-admin, creationPolicy: Owner }
  data:
    - secretKey: admin-password
      remoteRef: { key: {{ .Values.externalSecrets.adminPasswordRemoteKey }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { name: {{ .Values.externalSecrets.secretStoreRef }}, kind: ClusterSecretStore }
  target: { name: keycloak-db, creationPolicy: Owner }
  data:
    - secretKey: host
      remoteRef: { key: {{ .Values.externalSecrets.dbHostRemoteKey }} }
    - secretKey: port
      remoteRef: { key: {{ .Values.externalSecrets.dbPortRemoteKey }} }
    - secretKey: username
      remoteRef: { key: {{ .Values.externalSecrets.dbUserRemoteKey }} }
    - secretKey: database
      remoteRef: { key: {{ .Values.externalSecrets.dbNameRemoteKey }} }
    - secretKey: password
      remoteRef: { key: {{ .Values.externalSecrets.dbPasswordRemoteKey }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-internal-tls
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { name: {{ .Values.externalSecrets.secretStoreRef }}, kind: ClusterSecretStore }
  target:
    name: keycloak-internal-tls
    creationPolicy: Owner
    template: { type: kubernetes.io/tls }
  data:
    - secretKey: tls.crt
      remoteRef: { key: {{ .Values.externalSecrets.tlsCertRemoteKey }} }
    - secretKey: tls.key
      remoteRef: { key: {{ .Values.externalSecrets.tlsKeyRemoteKey }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-db-ca
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { name: {{ .Values.externalSecrets.secretStoreRef }}, kind: ClusterSecretStore }
  target: { name: keycloak-db-ca, creationPolicy: Owner }
  data:
    - secretKey: ca.crt
      remoteRef: { key: {{ .Values.externalSecrets.dbCaRemoteKey }} }
{{- end }}
