# Portable local-cluster profile. Images are pulled directly from GitHub
# Container Registry; credentials are provided out-of-band by ghcr-achivae.
image:
  repository: ghcr.io/achivae/gateway-ingestor
  tag: "1.0.1"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-achivae
replicas: 1
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
ingress:
  enabled: false
certificate:
  enabled: false
bootstrap:
  configServerUrl: http://config-ingestor:8888
  configFailFast: false
consul:
  enabled: false
vault:
  enabled: false
externalSecrets:
  enabled: false
networkPolicy:
  enabled: false
oidc:
  enabled: true
  issuerUri: http://127.0.0.1:8081/realms/spaceup-local
  jwkSetUri: http://platform-keycloak-local.platform-identity.svc.cluster.local/realms/spaceup-local/protocol/openid-connect/certs
  audiences: [spaceup-gateway]
  publicPaths: []

cors:
  enabled: true
  allowedOrigins: [http://localhost:4200]
monitoring:
  enabled: false
