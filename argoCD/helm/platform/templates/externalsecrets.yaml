{{- if .Values.secrets.externalSecrets.enabled }}
{{/* Azure identity and the ClusterSecretStore are created before platform sync. */}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef: { name: azure-keyvault, kind: ClusterSecretStore }
  target: { name: postgres-credentials, creationPolicy: Owner }
  data:
    - secretKey: postgres-password
      remoteRef: { key: {{ printf "%s-postgres-admin-password" .Values.secrets.secretPrefix | quote }} }
    - secretKey: password
      remoteRef: { key: {{ printf "%s-postgres-user-password" .Values.secrets.secretPrefix | quote }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef: { name: azure-keyvault, kind: ClusterSecretStore }
  target: { name: redis-credentials, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: {{ printf "%s-redis-password" .Values.secrets.secretPrefix | quote }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef: { name: azure-keyvault, kind: ClusterSecretStore }
  target: { name: keycloak-admin, creationPolicy: Owner }
  data:
    - secretKey: admin-password
      remoteRef: { key: {{ printf "%s-keycloak-admin-password" .Values.secrets.secretPrefix | quote }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef: { name: azure-keyvault, kind: ClusterSecretStore }
  target: { name: grafana-admin, creationPolicy: Owner }
  data:
    - secretKey: admin-user
      remoteRef: { key: {{ printf "%s-grafana-admin-user" .Values.secrets.secretPrefix | quote }} }
    - secretKey: admin-password
      remoteRef: { key: {{ printf "%s-grafana-admin-password" .Values.secrets.secretPrefix | quote }} }
{{- end }}
