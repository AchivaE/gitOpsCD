apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-keycloak-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: spaceup-platform-identity
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/helm/platform/identity/keycloak
    helm:
      valueFiles: [values.yaml, values-local.yaml]
      version: v3
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-identity
  # Synchronization stays manual: local-only credentials must exist first.
  syncPolicy:
    syncOptions:
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
