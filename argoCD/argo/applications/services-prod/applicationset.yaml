apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spaceup-platform-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    - list:
        elements:
          - name: config-ingestor
            chartPath: argoCD/helm/services/config-ingestor
            syncWave: "-10"
          - name: gateway-ingestor
            chartPath: argoCD/helm/services/gateway-ingestor
            syncWave: "0"
  template:
    metadata:
      name: "prod-{{name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
      labels:
        environment: prod
        app.kubernetes.io/name: "{{name}}"
    spec:
      project: spaceup-platform-prod
      source:
        repoURL: https://github.com/AchivaE/gitOpsCD.git
        path: "{{chartPath}}"
        targetRevision: main
        helm:
          valueFiles: [values.yaml, values-azure.yaml, values-prod.yaml]
          version: v3
      destination:
        server: https://kubernetes.default.svc
        namespace: spaceup
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - PrunePropagationPolicy=foreground
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - SkipSchemaValidation=false
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [/spec/replicas]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers: [/spec/conversion/webhook/clientConfig/caBundle]
