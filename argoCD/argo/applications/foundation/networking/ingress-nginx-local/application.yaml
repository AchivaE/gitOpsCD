apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-ingress-nginx-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
spec:
  project: spaceup-cluster-addons
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/helm/foundation/networking/ingress-nginx
    helm:
      releaseName: ingress-nginx
      valueFiles: [values.yaml, values-local.yaml]
      version: v3
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
      - FailOnSharedResource=true
