managedNamespaces: [spaceup]
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 90d
      resources:
        requests: { cpu: 1000m, memory: 4Gi }
        limits: { cpu: 2000m, memory: 8Gi }
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 200Gi
  grafana:
    persistence:
      size: 20Gi

cert-manager:
  replicaCount: 2
  cainjector:
    replicaCount: 2
  webhook:
    replicaCount: 2

