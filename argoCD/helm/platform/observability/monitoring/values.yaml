secrets:
  externalSecrets: { enabled: true, refreshInterval: 1h, secretStoreRef: azure-keyvault }
  grafanaAdmin: { usernameRemoteKey: spaceup-cluster-grafana-admin-user, passwordRemoteKey: spaceup-cluster-grafana-admin-password }
  alertmanager: { configRemoteKey: spaceup-cluster-alertmanager-config }
observability:
  platformAlerts: { enabled: true, certificateWarningDays: 14, certificateCriticalDays: 7, persistentVolumeWarningPercent: 15, persistentVolumeCriticalPercent: 5 }
kube-prometheus-stack:
  alertmanager: { alertmanagerSpec: { configSecret: alertmanager-config } }
  prometheus:
    prometheusSpec:
      retention: 30d
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      ruleSelector: {}
      ruleNamespaceSelector: {}
      storageSpec: { volumeClaimTemplate: { spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 50Gi } } } } }
  grafana:
    enabled: true
    admin: { existingSecret: grafana-admin, userKey: admin-user, passwordKey: admin-password }
    persistence: { enabled: true, type: pvc, accessModes: [ReadWriteOnce], size: 10Gi }
