# Dedicated AKS staging cluster: it owns staging resources only.
managedNamespaces: [spaceup-staging]
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 14d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 50Gi
  grafana:
    persistence:
      size: 10Gi
