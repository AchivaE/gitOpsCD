apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spaceup-platform-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    - git:
        repoURL: https://github.com/AchivaE/gitOpsCD.git
        revision: main
        directories:
          - path: argoCD/helm/services/*
  template:
    metadata:
      name: "dev-{{ path.basename }}"
      labels:
        environment: dev
        app.kubernetes.io/name: "{{ path.basename }}"
    spec:
      project: spaceup-platform-dev
      source:
        repoURL: https://github.com/AchivaE/gitOpsCD.git
        path: "{{ path }}"
        targetRevision: main
        helm:
          valueFiles: [values.yaml, values-local.yaml, values-dev.yaml]
          version: v3
      destination:
        server: https://kubernetes.default.svc
        namespace: spaceup-dev
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - SkipSchemaValidation=false
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [/spec/replicas]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers: [/spec/conversion/webhook/clientConfig/caBundle]
