apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-18"
    # Do not create a parallel Prometheus / Grafana stack before the legacy
    # Application has been orphaned safely.
    platform.spaceup.io/migration-mode: manual-sync-required
spec:
  project: spaceup-cluster-addons
  source: { repoURL: https://github.com/AchivaE/gitOpsCD.git, targetRevision: main, path: argoCD/helm/platform/observability/monitoring, helm: { valueFiles: [values.yaml, values-local.yaml], version: v3 } }
  destination: { server: https://kubernetes.default.svc, namespace: platform-system }
  syncPolicy:
    # Re-enable automated prune/self-heal only in the post-migration commit.
    syncOptions: [CreateNamespace=true, PrunePropagationPolicy=foreground, ServerSideApply=true, SkipDryRunOnMissingResource=true, FailOnSharedResource=true]
