{{- if hasPrefix "REPLACE_WITH_" .Values.image.tag }}
{{- fail "image.tag must be an immutable image tag or digest promoted by CI" }}
{{- end }}
{{- if and .Values.image.requireDigest (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.tag)) }}
{{- fail "production image.tag must be a sha256 digest promoted by CI" }}
{{- end }}
{{- if .Values.configRepository.enabled }}
{{- $repository := required "configRepository.uri must be supplied when configRepository.enabled=true" .Values.configRepository.uri }}
{{- if or (hasPrefix "REPLACE_WITH_" $repository) (not (hasPrefix "https://" $repository)) }}
{{- fail "configRepository.uri must be the HTTPS URL of the private configuration repository" }}
{{- end }}
{{- $revision := required "configRepository.defaultLabel must be supplied when configRepository.enabled=true" .Values.configRepository.defaultLabel }}
{{- if and .Values.configRepository.requireImmutableRevision (or (hasPrefix "REPLACE_WITH_" $revision) (not (or (regexMatch "^[a-f0-9]{40}$" $revision) (regexMatch "^v[0-9][0-9A-Za-z._-]*$" $revision)))) }}
{{- fail "configRepository.defaultLabel must be a reviewed full Git SHA or protected v* release tag" }}
{{- end }}
{{- if not .Values.externalSecret.enabled }}
{{- fail "configRepository requires External Secrets for Git credentials outside the local profile" }}
{{- end }}
{{- if or (not .Values.externalSecret.secretStoreRef) (hasPrefix "REPLACE_WITH_" .Values.externalSecret.usernameRemoteKey) (hasPrefix "REPLACE_WITH_" .Values.externalSecret.passwordRemoteKey) }}
{{- fail "configRepository requires a real Secret Store and Git credential remote keys" }}
{{- end }}
{{- range .Values.configRepository.egressCidrs }}
{{- if hasPrefix "REPLACE_WITH_" . }}
{{- fail "configRepository.egressCidrs must contain only the private Git endpoint CIDR(s)" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.consul.enabled }}
{{- $host := required "consul.host must name the private Consul HTTPS endpoint when consul.enabled=true" .Values.consul.host }}
{{- if hasPrefix "REPLACE_WITH_" $host }}
{{- fail "consul.host must be replaced with the private Consul DNS name before Argo CD can deploy config-ingestor" }}
{{- end }}
{{- if ne .Values.consul.scheme "https" }}
{{- fail "consul.scheme must be https in this production chart" }}
{{- end }}
{{- if ne (int .Values.consul.port) 8501 }}
{{- fail "consul.port must be the private HTTPS API port 8501" }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- range .Values.networkPolicy.consulEgressCidrs }}
{{- if hasPrefix "REPLACE_WITH_" . }}
{{- fail "networkPolicy.consulEgressCidrs must contain only the private Consul API CIDR(s)" }}
{{- end }}
{{- end }}
{{- if and .Values.monitoring.requiredForPromotion (not .Values.monitoring.serviceMonitorEnabled) }}
{{- fail "staging and production require monitoring.serviceMonitorEnabled=true after Prometheus endpoint verification" }}
{{- end }}
{{- if and .Values.monitoring.serviceMonitorEnabled (not .Values.monitoring.applicationMetricsVerified) }}
{{- fail "Set monitoring.applicationMetricsVerified=true only after the application exposes verified Prometheus metrics" }}
{{- end }}
{{- end }}
{{- end }}
