apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: spaceup-platform-runtime
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Stateful platform runtime modules, isolated from application workloads.
  sourceRepos:
    - https://github.com/AchivaE/gitOpsCD.git
  destinations:
    - namespace: platform-runtime
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
    # The Consul chart creates these named RBAC helpers only while generating
    # TLS, gossip-encryption and bootstrap-ACL material. The helper RBAC
    # objects and the five resulting secrets are intentionally retained: they
    # are the identity and encryption state of this Consul installation, not
    # unmanaged application workloads.
    ignore:
      - group: ""
        kind: ServiceAccount
        name: consul-gossip-encryption-autogenerate
      - group: ""
        kind: ServiceAccount
        name: consul-tls-init
      - group: rbac.authorization.k8s.io
        kind: Role
        name: consul-gossip-encryption-autogenerate
      - group: rbac.authorization.k8s.io
        kind: Role
        name: consul-tls-init
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
        name: consul-gossip-encryption-autogenerate
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
        name: consul-tls-init
      - group: ""
        kind: Secret
        name: consul-bootstrap-acl-token
      - group: ""
        kind: Secret
        name: consul-ca-cert
      - group: ""
        kind: Secret
        name: consul-ca-key
      - group: ""
        kind: Secret
        name: consul-gossip-encryption-key
      - group: ""
        kind: Secret
        name: consul-server-cert
