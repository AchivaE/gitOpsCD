apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-vault-local-store
  namespace: argocd
  annotations:
    # ESO is healthy from wave -20. Create the local store beside Vault so the
    # bootstrap script can unseal Vault without waiting for a parent wave that
    # itself waits on Vault health.
    argocd.argoproj.io/sync-wave: "-17"
spec:
  project: spaceup-cluster-addons
  source:
    repoURL: https://github.com/AchivaE/gitOpsCD.git
    targetRevision: main
    path: argoCD/argo/foundation/security/external-secrets/local
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
